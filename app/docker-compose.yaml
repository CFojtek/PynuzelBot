name: pynuzel-bot:latest
services:
  pynuzel-bot:
    container_name: pynuzel_bot_app
    build:
      context: ./
      dockerfile: dockerfile
      target: runtime
    depends_on:
      - signal-cli

  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    ports:
      - "8080:8080"
    volumes:
      - ./signal-cli-config:/home/.local/share/signal-cli
    environment:
      - MODE=json-rpc